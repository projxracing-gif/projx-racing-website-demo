<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}" data-locale="{{LOCALE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <base href="{{BASE}}">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("projxTheme");
        const system = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        const theme = saved === "light" || saved === "dark" ? saved : system;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.dataset.theme = "dark";
        document.documentElement.style.colorScheme = "dark";
      }
    })();
  </script>
  <meta name="theme-color" content="#08090d">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta name="application-name" content="Projx Racing">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Projx Racing">
  <meta name="format-detection" content="telephone=yes">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="alternate" hreflang="en-KW" href="{{HREFLANG_EN}}">
  <link rel="alternate" hreflang="ar-KW" href="{{HREFLANG_AR}}">
  <link rel="alternate" hreflang="x-default" href="{{HREFLANG_DEFAULT}}">

  <meta property="og:site_name" content="Projx Racing Co.">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="{{OG_TYPE}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:locale" content="{{OG_LOCALE}}">
  <meta property="og:locale:alternate" content="{{OG_ALT_LOCALE}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{OG_ALT}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">

  <title>{{TITLE}}</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon.png">
  <link rel="preload" href="assets/brand/projx-racing-logo-header.png" as="image" type="image/png">
  <link rel="preload" href="{{HERO_IMAGE}}" as="image" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="assets/styles.css">
  <script id="projx-structured-data" type="application/ld+json">{{STRUCTURED_DATA}}</script>
  <script defer src="assets/site-config.js"></script>
  <script defer src="assets/data.js"></script>
  <script defer src="assets/i18n/en.js"></script>
  <script defer src="assets/i18n/ar.js"></script>
  <script defer src="assets/app.js"></script>
</head>
<body data-route="{{ROUTE}}" data-locale="{{LOCALE}}" data-preview="false">
  <a class="skip-link" href="#main-content">{{SKIP_TEXT}}</a>
  <div id="app-shell">
    <header id="site-header" class="site-header"></header>
    <main id="main-content" tabindex="-1">{{FALLBACK_CONTENT}}</main>
    <footer id="site-footer" class="site-footer"></footer>
  </div>
  <div id="quote-drawer" class="drawer" aria-hidden="true"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <noscript>
    <div class="noscript-contact">
      <strong>{{NOSCRIPT_TEXT}}</strong>
      <a href="tel:+96597976052">{{NOSCRIPT_CALL}}</a>
      <a href="https://wa.me/96597976052">{{NOSCRIPT_WHATSAPP}}</a>
    </div>
  </noscript>
</body>
</html>
